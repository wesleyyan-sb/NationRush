<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="32" cy="32" r="30" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

  <!-- Globe Base -->
  <circle cx="30" cy="34" r="20" fill="url(#globeGrad)" opacity="0.85"/>
  
  <!-- Latitude & Longitude grid lines -->
  <ellipse cx="30" cy="34" rx="20" ry="8" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.4"/>
  <ellipse cx="30" cy="34" rx="9" ry="20" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.4"/>
  <line x1="10" y1="34" x2="50" y2="34" stroke="#ffffff" stroke-width="1.2" opacity="0.4"/>
  <line x1="30" y1="14" x2="30" y2="54" stroke="#ffffff" stroke-width="1.2" opacity="0.4"/>

  <!-- Continent Stylized silhouettes -->
  <path d="M22 24 Q 28 22 34 26 Q 30 32 23 31 Z" fill="#10b981" opacity="0.8"/>
  <path d="M25 36 Q 33 34 32 44 Q 26 46 25 36 Z" fill="#10b981" opacity="0.8"/>
  <path d="M36 28 Q 44 26 43 36 Q 37 38 36 28 Z" fill="#10b981" opacity="0.8"/>

  <!-- Speed / Rush Flame Accent -->
  <path d="M42 8 C38 14 36 18 39 23 C40 20 42 19 44 19 C44 23 42 27 38 31 C46 30 52 23 49 14 C48 11 45 9 42 8 Z" fill="url(#flameGrad)" filter="url(#glow)"/>

  <!-- Compass Needle Star -->
  <polygon points="30,16 33,26 43,29 33,32 30,42 27,32 17,29 27,26" fill="#ffffff" opacity="0.9"/>
  <circle cx="30" cy="29" r="2" fill="#ef4444"/>
</svg>
